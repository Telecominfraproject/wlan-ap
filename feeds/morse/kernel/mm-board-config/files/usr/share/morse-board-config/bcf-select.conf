# BCF (board config file) selection table for the Morse Micro HaLow chip.
#
# Read by /etc/hotplug.d/ieee80211/21-morse-bcf-select. Four comma separated
# fields, no spaces:
#
#   chip,board_type,region,bcf
#
#   chip        Chip family as detected at run time: MM6108, MM8108, ...
#               Must match exactly. A chip with no row in this file gets NO BCF:
#               the selector logs that and leaves bcf_default.bin alone rather
#               than applying another chip's board config.
#   board_type  OTP board type, four lowercase hex digits, or * for "any".
#               0000 means the OTP is not burnt.
#   region      Regulatory region derived from wireless.<radio>.country by the
#               selector: JP, EU, or DEFAULT. A DEFAULT row matches any region.
#   bcf         File name under /lib/firmware/morse/, or the literal "none".
#               "none" means "this region has no authorised BCF": the selector
#               logs an error naming the missing deliverable and leaves
#               bcf_default.bin exactly as installed. It exists so that a region
#               with no file does NOT fall through to the DEFAULT row, because a
#               DEFAULT row matches every region by design.
#
# First matching row wins, so specific rows go above general ones.
#
# Adding a chip, a board variant or a region is adding a row here plus the file
# name in BCF_SET_<profile>_<chip> in the package Makefile - never a change to
# the selection logic.
#
# Note on regions: the driver copies the BCF's .board_config section plus the
# .regdom_<country> section for the country the module was loaded with, and logs
# "Country code <cc> not found in BCF" if that section is absent. So a row must
# point at a BCF that actually carries the regdom for the countries of that
# region, not merely at a BCF that loads.

# --- MM6108 -------------------------------------------------------------------
# Board configs from the 1.1x driver era carry .board_config version 5.
# mm6108-2.0.1 firmware only accepts version 12 and answers anything else with
# "BCF version not supported" followed by "Chip started in failsafe mode", which
# is exactly what the first EAP112 image on this firmware did. So there is no
# "keep using the old file" option for any of these rows - the old files have
# been deleted from the package.
#
# Regdom coverage of the mm6108-2.0.1 files, read from their ELF sections:
#   bcf_mf08651_us.bin  BR US AU CA   (BR/AU compliant, CA/US certified)
#   bcf_mf08651_jp.bin  JP            (JP certified)
# Everything else the release ships for MM6108 is a different module
# (bcf_mf28551.bin, bcf_mm_hl1*.bin, the azurewave/netprisma/quectel trees), not
# an mf08651, so none of them is a candidate for this board.
MM6108,*,JP,bcf_mf08651_jp.bin
# EU/CE: bcf_mf08651_eu.bin is supplied locally in the package (mm6108-2.0.1 has
# no CE board config for the mf08651 module, so it cannot come from upstream).
# Verified: .board_config version 12 (the generation this firmware accepts) and it
# carries .regdom_EU plus .regdom_GB, so both EU and GB resolve here.
MM6108,*,EU,bcf_mf08651_eu.bin
# DEFAULT covers every remaining country. bcf_mf08651_us.bin only carries
# BR/US/AU/CA, so a country outside that set still ends up with no board config -
# the driver reports "Country code <cc> not found in BCF". Countries the 1.11-era
# file used to cover and this one does not: EU, IN, KR, NZ, SG (and JP, which now
# has its own row above). Those are part of the same missing-deliverable item.
MM6108,*,DEFAULT,bcf_mf08651_us.bin

# --- MM8108 -------------------------------------------------------------------
# Intentionally no rows: no MM8108 board config has been authorised for EAP112
# hardware. Until one is, an MM8108 fitted to this board is reported as
# "no BCF available" instead of being given the MM6108 files.
# To support MM8108, add rows here of the form
#   MM8108,*,DEFAULT,<bcf name>
# and add the same names to BCF_SET_edgecore_eap112_MM8108 in the Makefile.
