---
profile: edgecore_eap111
target: mediatek
subtarget: filogic
description: Build image for the EdgeCore EAP111
image: bin/targets/mediatek/filogic/openwrt-mediatek-filogic-edgecore_eap111-squashfs-sysupgrade.bin
feeds:
  - name: mtk
    path: ../../feeds/mtk-app
  - name: mediatek
    path: ../../feeds/mediatek
  - name: ble
    path: ../../feeds/ble-support
include:
  - ucentral-ap
  - ble-support
packages:
  - kmod-phy-airoha-an8801sb
  - socat
  - cc2652r1
diffconfig: |
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_USLEEP=y
