---
profile: edgecore_eap105
target: ipq53xx
subtarget: generic
description: Build image for the edgecore eap105
image: bin/targets/ipq53xx/generic/openwrt-ipq53xx-edgecore_eap105-squashfs-sysupgrade.bin
feeds:
  - name: qca
    path: ../../feeds/qca-wifi-7
include:
  - ucentral-ap
packages:
  - ipq53xx
  - qca-ssdk-shell
  - efr32mg21
diffconfig: |
  CONFIG_KERNEL_IPQ_MEM_PROFILE=0
  CONFIG_KERNEL_DEVMEM=y
  CONFIG_BUSYBOX_CUSTOM=y
  CONFIG_BUSYBOX_CONFIG_STTY=y
  CONFIG_BUSYBOX_CONFIG_TIMEOUT=y
  CONFIG_BUSYBOX_CONFIG_FLOAT_DURATION=y
  CONFIG_BUSYBOX_CONFIG_MICROCOM=y
  CONFIG_BUSYBOX_CONFIG_OD=y
