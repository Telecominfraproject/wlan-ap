---
description: Add HaLow (802.11ah) support for the Morse Micro dongle
feeds:
  - name: morse
    path: ../../feeds/morse
packages:
  # Morse HaLow driver, firmware and board config
  - kmod-morse
  - morse-fw
  - morse-board-config
  # USB stack for the dongle
  - kmod-usb-core
  - kmod-usb3
  - kmod-usb-xhci-mtk
  - usbutils
  # I2C tools, used to power the dongle via halow-gpio-reset
  - kmod-i2c-core
  - i2c-tools
  # HaLow radio bring-up: netifd handler and userspace
  - netifd-morse
  - hostapd_s1g
  - wpa_supplicant_s1g
  - morsecli
  - morse_mesh11sd
  - wpa_event_listener
  - morse-regdb
