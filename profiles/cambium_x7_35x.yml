# SPDX-License-Identifier: GPL-2.0
---
# profile: MUST equal the Device/ name in feeds/qca-wifi-7/ipq53xx/image/ipq53xx.mk
# character for character -- gen_config.py turns it into
#   CONFIG_TARGET_ipq53xx_generic_DEVICE_cambium_x7_35x=y
# A mismatch produces a config symbol no target defines, and the build
# silently produces no image for this board.
profile: cambium_x7_35x
target: ipq53xx
subtarget: generic
description: Build image for the Cambium X7-35X (IPQ5332 + QCN9224, tri-band, one 2.5G port)
image: bin/targets/ipq53xx/generic/openwrt-ipq53xx-cambium_x7_35x-squashfs-sysupgrade.bin
feeds:
  - name: qca
    path: ../../feeds/qca-wifi-7
include:
  - ucentral-ap
packages:
  - ipq53xx
  - qca-ssdk-shell
diffconfig: |
  CONFIG_KERNEL_IPQ_MEM_PROFILE=0
