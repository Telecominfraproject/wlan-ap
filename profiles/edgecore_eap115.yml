---
profile: edgecore_eap115
target: mediatek
subtarget: filogic
description: Build image for the EdgeCore EAP115
image: bin/targets/mediatek/filogic/openwrt-mediatek-filogic-edgecore_eap115-squashfs-sysupgrade.bin
feeds:
  - name: mtk
    path: ../../feeds/mtk-app
  - name: mediatek
    path: ../../feeds/mediatek
  - name: ble
    path: ../../feeds/ble-support
include:
  - ucentral-ap
  - ble-support
packages:
  - kmod-mt798x-2p5g-phy
  - mt798x-2p5g-phy-firmware-internal
  - nrf54l15
  - kmod-bluetooth-6lowpan
  - kmod-hci-uart
  - python3
  - python3-dbus-fast
  - python3-setuptools
  - python3-wheel
diffconfig: |
  CONFIG_WIFI_SCRIPTS_UCODE=y
