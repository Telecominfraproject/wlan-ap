---
profile: sonicfi_rap736c
target: mediatek
subtarget: filogic
description: Build image for the SonicFi RAP736C
image: bin/targets/mediatek/filogic/openwrt-mediatek-filogic-sonicfi_rap736c-squashfs-sysupgrade.bin
include:
  - mtk-sdk
  - ucentral-ap
packages:
  - kmod-mt798x-2p5g-phy
  - mt798x-2p5g-phy-firmware-internal
  - smp_util
diffconfig: |
  CONFIG_PACKAGE_uboot-envtools=y
  CONFIG_PACKAGE_kmod-reset-boot-count=y
  CONFIG_WIFI_SCRIPTS_UCODE=y
