name: PR Guidelines

# Enforces OPENWIFI_PR_GUIDELINES.md + OPENWIFI_CODING_GUIDELINES.md
# on every feature/general-fix PR targeting main (and the LTS staging branch).
#
# 'edited' is included so re-running after a PR description fix works
# without a force-push. 'milestoned'/'demilestoned' are included because
# milestone changes do not raise an 'edited' event, and the milestone check
# below needs to re-evaluate when one is set or cleared.
#
# One job runs all checks, aggregates their findings into a single sticky PR
# comment (so the author is informed directly), then fails if any hard rule was
# violated. Check details also appear as inline Checks annotations.
#
# Fork PRs are failed by a gate that runs before checkout; see that step.
#
# Can also be run by hand with a PR number. A dispatch run attaches to a
# branch, not a PR, so it cannot satisfy a required status check — it reports
# in the job summary and the sticky comment.

on:
  pull_request:
    # 'ready_for_review' matters because the job is gated on draft == false:
    # without it, taking a PR out of draft would never trigger a run, leaving a
    # required check permanently unstarted until the next push.
    types: [opened, synchronize, reopened, edited, ready_for_review, milestoned, demilestoned]
    branches:
      - main
      - staging-for-v4.2.0-LTS
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check (e.g. 1234)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

# Only one run per PR at a time; cancel superseded runs so rapid pushes don't
# race to create duplicate comments or waste CI minutes. Manual runs share the
# group, so they can't double-post.
concurrency:
  group: pr-guidelines-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  guidelines:
    name: PR & commit guidelines
    runs-on: ubuntu-latest
    # Fork PRs are NOT excluded here: a skipped job reports no failure, so the
    # fork gate below has to run and fail instead. Manual runs always proceed —
    # the draft flag isn't known until the resolve step has called the API.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    steps:
      # One API read serves both triggers: a dispatch run has no
      # github.event.pull_request payload, only the PR number typed in. It also
      # means a re-run picks up an edited description or milestone.
      #
      # The body goes to a file under RUNNER_TEMP (outside the workspace, so
      # checkout won't wipe it) because GITHUB_OUTPUT is line-based and a
      # multi-line body could forge output lines.
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Exactly one of these is non-empty.
          PR_NUMBER_RAW: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          # Free text on a manual run — validate before it reaches an API path.
          case "$PR_NUMBER_RAW" in
            ''|*[!0-9]*)
              echo "::error::pr_number must be a positive integer (got: '$PR_NUMBER_RAW')."
              exit 1 ;;
          esac

          if ! gh api "repos/$REPO/pulls/$PR_NUMBER_RAW" > "$RUNNER_TEMP/pr.json"; then
            echo "::error::PR #$PR_NUMBER_RAW not found in $REPO."
            exit 1
          fi

          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr_body.txt"

          get() { jq -r "$1" "$RUNNER_TEMP/pr.json"; }

          HEAD_SHA="$(get '.head.sha // ""')"
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::PR #$PR_NUMBER_RAW has no head SHA (deleted branch?)."
            exit 1
          fi

          {
            echo "number=$PR_NUMBER_RAW"
            echo "head_repo=$(get '.head.repo.full_name // ""')"
            echo "head_sha=$HEAD_SHA"
            echo "head_ref=$(get '.head.ref // ""')"
            echo "base_sha=$(get '.base.sha // ""')"
            echo "base_ref=$(get '.base.ref // ""')"
            # Strip newlines so a crafted title can't inject output lines.
            echo "milestone=$(get '.milestone.title // ""' | tr -d '\n\r')"
          } >> "$GITHUB_OUTPUT"

          echo "PR #$PR_NUMBER_RAW: $(get '.head.repo.full_name // "?"'):$(get '.head.ref') -> $(get '.base.ref')"
          echo "State: $(get '.state'), draft: $(get '.draft')"

      # Keep this BEFORE actions/checkout. A fork PR's token is read-only, so
      # the sticky comment can't post and run_check would build a comment that
      # is never delivered; the annotation and job summary still work. It also
      # means the fork's .github/scripts are never executed — which matters most
      # on a manual run, where the token IS writable. Inline rather than a
      # script for the same reason: a script in the tree is the PR's own copy.
      - name: Reject PRs from forks
        if: steps.pr.outputs.head_repo != github.repository
        env:
          HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          {
            echo "## ❌ PRs from forks are not accepted"
            echo ""
            echo "This PR's head branch lives in \`$HEAD_REPO\`, not in \`$REPO\`."
            echo ""
            echo "Push your branch to \`$REPO\` and open the PR from there. If you"
            echo "don't have push access, ask a maintainer for it or to re-open"
            echo "this change as a branch in the repository."
            echo ""
            echo "No other guideline checks were run — this one gates the rest."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::PRs from forks are not allowed (head repo: $HEAD_REPO)."
          exit 1

      - uses: actions/checkout@v4
        with:
          # Full history so the BASE..HEAD rev-list range resolves.
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Run checks and post PR comment
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          # Body arrives as a file, not a value — see the resolve step.
          PR_BODY_FILE: ${{ runner.temp }}/pr_body.txt
          # Empty when no milestone is assigned.
          PR_MILESTONE: ${{ steps.pr.outputs.milestone }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -uo pipefail
          MARKER="<!-- pr-guidelines-check -->"
          FAIL=0
          : > sections.md

          # Held in a file so a multi-line body can't forge GITHUB_OUTPUT
          # lines; the checks below just use it as a variable.
          PR_BODY="$(cat "$PR_BODY_FILE")"

          # Run a check command, re-emit its output (so ::error::/::warning::
          # annotations still render), and fold its findings into the comment.
          run_check() {
            local title="$1"; shift
            local out rc
            out="$("$@" 2>&1)"; rc=$?
            echo "$out"

            {
              echo "### $title"
              echo ""
              local lines
              # Matches both bare annotations and ones carrying properties
              # (`::error file=src/foo.c,line=42::`); the properties are dropped
              # from the bullet, so each message repeats path:line in its text.
              lines="$(echo "$out" | grep -E '^::(error|warning)[^:]*::' || true)"
              if [ -n "$lines" ]; then
                echo "$lines" | sed -E 's/^::error[^:]*:: ?/- ❌ /; s/^::warning[^:]*:: ?/- ⚠️ /'
              elif [ "$rc" -ne 0 ]; then
                # Non-zero exit but no annotation — the check crashed rather than
                # reporting a specific violation. Don't claim "no issues".
                echo "- ❌ Check failed unexpectedly — see the Actions log for details."
              else
                echo "No issues found."
              fi
              echo ""
            } >> sections.md

            [ "$rc" -ne 0 ] && FAIL=1
            return 0
          }

          # ------------------------------------------------------------------
          # 1. Commit hygiene: linear history, count, subjects, trailers (A2, A3, A7)
          # ------------------------------------------------------------------
          run_check "Commit hygiene" bash .github/scripts/check-commits.sh

          # ------------------------------------------------------------------
          # 2. C style: tabs, SPDX header on new files (coding guidelines §3)
          #    Runs only on changed .c/.h files, so it never blocks doc PRs.
          # ------------------------------------------------------------------
          run_check "C style" bash .github/scripts/check-c-style.sh

          # ------------------------------------------------------------------
          # 3. PR description: ticket link (A4)
          #    Test evidence is NOT enforced here — it lives in the Jira ticket
          #    when a reviewer requests it, not in the PR description.
          # ------------------------------------------------------------------
          # Routed through run_check so the ::error:: reaches stdout (inline
          # annotation) and only the bullet lands in the sticky comment.
          # The ticket must be in the PR *description* — a commit `Fixes:` trailer
          # alone does not satisfy A4, so the error says so explicitly and quotes
          # the ticket the commits already name, to make the fix copy-pasteable.
          check_pr_desc() {
            local ticket
            ticket="$(printf '%s' "$PR_BODY" \
              | grep -oE '\bWIFI-[0-9]+\b' | head -n1 || true)"
            if [ -n "$ticket" ]; then
              echo "PR description references $ticket."
              return 0
            fi

            # Merge-base range: base.sha is the base-branch tip at event time, so
            # the two-dot form would also scan commits the PR never made.
            ticket="$(git log --format='%B' "$(git merge-base "$BASE_SHA" "$HEAD_SHA")..$HEAD_SHA" \
              | grep -oE '\bWIFI-[0-9]+\b' | head -n1 || true)"

            if [ -n "$ticket" ]; then
              echo "::error::PR description does not reference a ticket — the commits mention $ticket, so add it to the description as well (e.g. a \`Ticket: $ticket\` line). A commit \`Fixes:\` trailer alone does not satisfy this check (guidelines A4)."
            elif [ -z "${PR_BODY//[[:space:]]/}" ]; then
              echo "::error::PR description is empty. It must state what/why, the ticket (\`WIFI-#####\`), the affected targets/boards and the test evidence (guidelines A4)."
            else
              echo "::error::PR description must reference the ticket, e.g. a \`Ticket: WIFI-15706\` line or a Jira link (guidelines A4)."
            fi
            return 1
          }
          run_check "PR description (ticket link)" check_pr_desc

          # ------------------------------------------------------------------
          # 4. Milestone: the author must attach their PR to the target release
          #    milestone so the change is tracked in the right release notes.
          #    Reported as a warning (not a hard failure) so an otherwise-good PR
          #    isn't blocked - but it is the author's job to set it.
          # ------------------------------------------------------------------
          check_milestone() {
            if [ -n "${PR_MILESTONE:-}" ]; then
              echo "Milestone: $PR_MILESTONE"
              return 0
            fi
            echo "::warning::No milestone set. Assign the target release milestone to this PR so the change is tracked in the release notes."
            return 0
          }
          run_check "Milestone" check_milestone

          # ------------------------------------------------------------------
          # 5. Report: aggregate all findings into one sticky PR comment,
          #    then fail last so the comment is always posted first.
          # ------------------------------------------------------------------
          {
            echo "$MARKER"
            if [ "$FAIL" -ne 0 ]; then
              echo "## ❌ PR & Commit Guidelines — action needed"
              echo ""
              echo "This PR doesn't yet follow the OpenWiFi contribution guidelines. Fix the ❌ items below, then re-push (\`git push --force-with-lease\`) or edit the PR description to re-run."
            else
              echo "## ✅ PR & Commit Guidelines — all checks passed"
              echo ""
              echo "Commits, PR description, C style, and milestone all look good. Thanks!"
            fi
            echo ""
            cat sections.md
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "_Checked manually against \`$HEAD_SHA\`._"
              echo ""
            fi
            # Absolute links: relative paths don't resolve inside PR comments.
            DOCS="$GITHUB_SERVER_URL/$REPO/blob/main"
            echo "See [OPENWIFI_PR_GUIDELINES.md]($DOCS/OPENWIFI_PR_GUIDELINES.md) and [OPENWIFI_CODING_GUIDELINES.md]($DOCS/OPENWIFI_CODING_GUIDELINES.md). Items marked ⚠️ are advisory and do not fail the check."
          } > comment.md

          cat comment.md >> "$GITHUB_STEP_SUMMARY"

          # Post or update the sticky comment (found via the hidden marker).
          EXISTING="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1 || true)"

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@comment.md >/dev/null
            echo "Updated existing comment $EXISTING."
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@comment.md >/dev/null
            echo "Created new comment."
          fi

          # Fail the check last, so the comment is always posted first.
          if [ "$FAIL" -ne 0 ]; then
            echo "PR/commit guidelines not satisfied. See the PR comment for details."
            exit 1
          fi
          echo "All PR & commit guideline checks passed."
